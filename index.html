const KEYS = ['A','B','C','D'];
let ans = new Array(Q.length).fill(-1);
let done = new Array(Q.length).fill(false);
let globalTimeLeft = 1800;
let globalTmr = null;
const sndCorrect = new Audio("applause.mp3");

function startGlobalTimer(){
  if(globalTmr) return;
  updTimerDisplay();
  globalTmr=setInterval(()=>{
    globalTimeLeft--;
    updTimerDisplay();
    if(globalTimeLeft<=0){clearInterval(globalTmr);globalTmr=null;showResults();}
  },1000);
}
function updTimerDisplay(){
  const el=document.getElementById('tmr'); if(!el)return;
  const mins=Math.floor(globalTimeLeft/60),secs=globalTimeLeft%60;
  el.textContent=(mins<10?'0':'')+mins+':'+(secs<10?'0':'')+secs;
  el.className=globalTimeLeft<=120?'timer-txt red':'timer-txt';
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderAllQuestions(){
 let out=`<div class="top-bar">
 <div class="header-profile"><div class="header-text-block">
 <span class="quiz-title">KTET GURU PLUS – PSYCHOLOGY MODEL TEST</span>
 <span class="quiz-subtitle">Perception, Intelligence, Tests, Creativity, Attitude & Anxiety</span>
 <div style="margin-top:2px"><a href="https://guruplusblog.blogspot.com/" target="_blank" style="color:#93C5FD;font-size:11px;font-weight:600;text-decoration:none">guruplusblog.blogspot.com</a></div>
 </div><div class="header-actions"><a href="https://wa.me/919539846888" target="_blank" class="whatsapp-btn">WhatsApp</a></div></div>
 <div class="top-row" style="margin-top:10px"><div class="timer-pill"><span class="timer-label">Time Left:</span><span class="timer-txt" id="tmr">30:00</span></div><span class="q-badge">Total: ${Q.length}</span></div></div>`;
 Q.forEach((q,qi)=>{
  const ua=ans[qi],isDone=done[qi];
  const opts=q.o.map((o,oi)=>{
   let cls='opt';
   if(isDone){if(oi===q.a)cls+=' correct-ans';else if(oi===ua)cls+=' wrong-ans';else cls+=' neutral-locked';}
   else cls+=' unanswered';
   return `<div class="${cls}" role="button" tabindex="0" onclick="pick(${qi},${oi})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();pick(${qi},${oi})}"><span class="opt-key ${KEYS[oi]}">${KEYS[oi]}</span><span class="opt-txt">${esc(o)}</span></div>`;
  }).join('');
  let exp='';
  if(isDone){
   const ok=ua===q.a;
   exp=`<div class="option-explanation"><b>നിങ്ങൾ തിരഞ്ഞെടുത്തത്: ${KEYS[ua]}) ${esc(q.o[ua])}</b><br>${esc(q.oexp[ua])}</div>
   <div class="exp-box ${ok?'correct':'wrong'}"><div class="exp-label">${ok?'✓ ശരി / Correct!':'✗ തെറ്റ് / Incorrect'}</div><b>ശരിയായ ഉത്തരം: ${KEYS[q.a]}) ${esc(q.o[q.a])}</b><br>${esc(q.oexp[q.a])}</div>`;
  }
  out+=`<div class="q-container" id="q-box-${qi}"><div class="q-num">Question ${q.num}</div>
  <div class="q-text-en">${esc(q.q_en)}</div><div class="q-text-en" style="color:#334155;font-weight:500">${esc(q.q_ml)}</div>
  <div class="opts">${opts}</div>${exp}</div>`;
 });
 out+=`<div class="action-container"><button class="btn-submit-all" onclick="showResults()">Submit Test</button></div>`;
 document.getElementById('app').innerHTML=out;updTimerDisplay();
}
function pick(qi,oi){
 if(done[qi])return;
 ans[qi]=oi;done[qi]=true;
 if(oi===Q[qi].a){sndCorrect.currentTime=0;sndCorrect.play().catch(()=>{});}
 const box=document.getElementById('q-box-'+qi);
 if(box){
  const q=Q[qi],ua=ans[qi],ok=ua===q.a;
  const opts=q.o.map((o,idx)=>{
   let cls='opt';
   if(idx===q.a)cls+=' correct-ans';else if(idx===ua)cls+=' wrong-ans';else cls+=' neutral-locked';
   return `<div class="${cls}"><span class="opt-key ${KEYS[idx]}">${KEYS[idx]}</span><span class="opt-txt">${esc(o)}</span></div>`;
  }).join('');
  const allExp=q.o.map((o,idx)=>`<div class="option-explanation" style="background:${idx===q.a?'#EAF3DE':(idx===ua?'#FCEBEB':'#FFF7D6')};border-color:${idx===q.a?'#1D9E75':(idx===ua?'#E24B4A':'#FDE047')};color:${idx===q.a?'#085041':(idx===ua?'#791F1F':'#713F12')}"><b>${KEYS[idx]}) ${esc(o)} ${idx===q.a?'— ശരിയായ ഉത്തരം':(idx===ua?'— നിങ്ങൾ തിരഞ്ഞെടുത്ത ഉത്തരം':'— വിശദീകരണം')}</b><br>${esc(q.oexp[idx])}</div>`).join('');
  box.innerHTML=`<div class="q-num">Question ${q.num}</div><div class="q-text-en">${esc(q.q_en)}</div>
  <div class="q-text-en" style="color:#334155;font-weight:500">${esc(q.q_ml)}</div><div class="opts">${opts}</div>
  <div class="exp-box ${ok?'correct':'wrong'}"><div class="exp-label">${ok?'✓ ശരി / Correct!':'✗ തെറ്റ് / Incorrect'}</div>
  <b>ശരിയായ ഉത്തരം: ${KEYS[q.a]}) ${esc(q.o[q.a])}</b><br>${esc(q.oexp[q.a])}</div>
  <div class="review-title">ഓരോ ഓപ്ഷന്റെയും വിശദീകരണം (മലയാളം)</div>${allExp}`;
 }
}
function showResults(){
 if(globalTmr){clearInterval(globalTmr);globalTmr=null;}
 let c=0,w=0,s=0;
 ans.forEach((a,i)=>{if(a===-1)s++;else if(a===Q[i].a)c++;else w++;});
 const pct=Q.length?Math.round(c/Q.length*100):0;
 const grade=pct>=80?'Excellent!':pct>=60?'Good effort!':pct>=40?'Keep practising':'Keep going!';
 let rev=Q.map((q,i)=>{
  const ua=ans[i],isC=ua===q.a,isS=ua===-1,rc=isS?'rs':isC?'rc':'rw',label=isS?'Skipped':isC?'Correct':'Wrong';
  return `<div class="r-card ${rc}"><div class="r-head"><span class="r-badge ${rc}">${label}</span><span>Q${q.num}</span></div>
  <div class="r-qtxt-en">${esc(q.q_en)}<br><span style="color:#334155;font-weight:500">${esc(q.q_ml)}</span></div>
  ${!isS&&!isC?`<div class="r-ans wrong">Your answer: ${KEYS[ua]}. ${esc(q.o[ua])}<br>${esc(q.oexp[ua])}</div>`:''}
  <div class="r-ans correct">Correct: ${KEYS[q.a]}. ${esc(q.o[q.a])}</div><div class="r-exp">${esc(q.oexp[q.a])}</div></div>`;
 }).join('');
 document.getElementById('app').innerHTML=`<div class="result-top"><div class="score-ring"><span class="score-big">${c}</span><span class="score-sub">/ ${Q.length}</span></div><div class="result-label">${grade}</div><div class="result-sub">${pct}% · ${c} correct out of ${Q.length}</div></div>
 <div class="stats-grid"><div class="stat-c green"><div class="stat-n">${c}</div><div class="stat-l">Correct</div></div><div class="stat-c red"><div class="stat-n">${w}</div><div class="stat-l">Wrong</div></div><div class="stat-c gray"><div class="stat-n">${s}</div><div class="stat-l">Skipped</div></div></div>
 <div class="review-title">Full Review / വിശദമായ അവലോകനം</div>${rev}<button class="restart-btn" onclick="restartQuiz()">Restart Quiz</button>`;
 window.scrollTo(0,0);
}
function restartQuiz(){ans=new Array(Q.length).fill(-1);done=new Array(Q.length).fill(false);globalTimeLeft=1800;renderAllQuestions();startGlobalTimer();window.scrollTo(0,0);}
renderAllQuestions();startGlobalTimer();

</script></body></html>
